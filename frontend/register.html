<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — MiniStore</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container">
  <h1 class="page-title">Create Account</h1>
  <div class="form-card">
    <div id="alert-box"></div>
    <form id="register-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" minlength="6" required>

      <button type="submit" class="btn" style="width:100%">Register</button>
    </form>
    <p style="margin-top:14px;font-size:0.9rem">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </div>
</main>

<footer class="site-footer">MiniStore — a demo full-stack e-commerce project</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('alert-box');
  alertBox.innerHTML = '';
  try {
    const data = await api.post('/auth/register', {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    Auth.save(data.token, data.user);
    window.location.href = 'index.html';
  } catch (err) {
    alertBox.innerHTML = `<div class="alert error">${err.message}</div>`;
  }
});
</script>
</body>
</html>
