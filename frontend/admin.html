<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — MiniStore</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container">
  <h1 class="page-title">Admin Panel</h1>
  <div id="alert-box"></div>

  <div id="stat-grid" class="stat-grid"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="products">Products</button>
    <button class="tab-btn" data-tab="orders">Orders</button>
    <button class="tab-btn" data-tab="users">Users</button>
  </div>

  <!-- Products tab -->
  <section id="tab-products">
    <button class="btn small" id="new-product-btn" style="margin-bottom:16px">+ Add Product</button>
    <div id="product-form-wrap"></div>
    <div id="admin-products-table"></div>
  </section>

  <!-- Orders tab -->
  <section id="tab-orders" style="display:none">
    <div id="admin-orders-table"></div>
  </section>

  <!-- Users tab -->
  <section id="tab-users" style="display:none">
    <div id="admin-users-table"></div>
  </section>
</main>

<footer class="site-footer">MiniStore — a demo full-stack e-commerce project</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
